<div class="box"><form method="get" class="filtros"><label>Módulo<select name="modulo"><option value="">Todos</option>{% for slug,info in modulos.items() %}<option value="{{slug}}" {{'selected' if request.args.get('modulo')==slug}}>{{info[0]}}</option>{% endfor %}<option value="acesso">Acesso</option></select></label><label>De<input type="date" name="inicio" value="{{request.args.get('inicio','')}}"></label><label>Até<input type="date" name="fim" value="{{request.args.get('fim','')}}"></label><button>Filtrar</button></form><p class="muted">Até 1.000 registros mais recentes do período.</p>
    <table><thead><tr><th>Data</th><th>Usuário</th><th>Módulo</th><th>Ação</th><th>Registro</th><th>Detalhes</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.data}}</td><td>{{r.nome or 'Acesso público'}}</td><td>{{r.modulo}}</td><td>{{r.acao}}</td><td>{{r.registro_id or '—'}}</td><td>{{r.detalhes or ''}}</td></tr>{% else %}<tr><td colspan="6">Nenhum registro encontrado.</td></tr>{% endfor %}</tbody></table></div>
