
    <a class="button secondary" href="{{ url_for('compras_documentos.compras') }}">Voltar às compras</a>
    <div class="box"><table><thead><tr><th>Nome</th><th>CNPJ / CPF</th><th>Contato</th><th>Situação</th></tr></thead><tbody>{% for f in rows %}<tr><td><a href="{{ url_for('compras_documentos.fornecedor_editar',fid=f.id) }}">{{ f.nome }}</a></td><td>{{ f.documento or '—' }}</td><td>{{ f.contato }}<br>{{ f.email }}</td><td><form method="post">{{ csrf_field() }}<input type="hidden" name="acao" value="situacao"><input type="hidden" name="id" value="{{ f.id }}"><input type="hidden" name="ativo" value="{{ 0 if f.ativo else 1 }}"><button class="secondary">{{ 'Inativar' if f.ativo else 'Reativar' }}</button></form></td></tr>{% else %}<tr><td colspan="4">Nenhum fornecedor cadastrado.</td></tr>{% endfor %}</tbody></table></div>
    <div class="box"><h2>Novo fornecedor</h2><form method="post">{{ csrf_field() }}<div class="grid-form"><label>Nome<input name="nome" required maxlength="200"></label><label>CNPJ / CPF<input name="documento" maxlength="30"></label><label>Contato<input name="contato" maxlength="200"></label><label>E-mail<input type="email" name="email" maxlength="254"></label></div><button>Cadastrar fornecedor</button></form></div>
